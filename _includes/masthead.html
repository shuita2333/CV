<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg"><a href="#about" target="_self">Yuanhe Zhang</a></li>
          {% for link in site.data.navigation.main %}
            {% if link.external %}
              <li class="masthead__menu-item"><a class="external-nav-link" href="{{ link.url }}" target="_blank" rel="noopener noreferrer" data-label-en="{{ link.title }}" data-label-zh="{{ link.title_zh }}"><span class="external-nav-label">{{ link.title }}</span> <i class="fas fa-external-link-alt" aria-hidden="true"></i></a></li>
            {% else %}
              <li class="masthead__menu-item"><a class="section-link" href="{{ link.url }}" target="_self" data-label-en="{{ link.title }}" data-label-zh="{{ link.title_zh }}">{{ link.title }}</a></li>
            {% endif %}
          {% endfor %}
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
      <div class="masthead__language">
        <button id="language-toggle" class="language-toggle" type="button" aria-label="切换至中文" aria-pressed="false">
          <i class="fas fa-language" aria-hidden="true"></i>
          <span class="language-toggle__label">中文</span>
        </button>
      </div>
    </div>
  </div>
</div>
