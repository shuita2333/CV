<div itemscope itemtype="https://schema.org/Person" class="profile_box">
  <div class="author__avatar">
    <img src="{{ site.author.avatar }}" alt="Portrait of Yuanhe Zhang" itemprop="image">
  </div>

  <div class="author__content">
    <h1 class="author__name" itemprop="name">
      <span data-lang="en">{{ site.author.name }}</span>
      <span data-lang="zh" hidden>{{ site.author.name_zh }}</span>
    </h1>
    <p class="author__bio">
      <span data-lang="en">{{ site.author.bio }}</span>
      <span data-lang="zh" hidden>{{ site.author.bio_zh }}</span>
    </p>
  </div>

  <div class="author__urls-wrapper">
    <ul class="author__urls social-icons">
      <li>
        <i class="fa fa-fw fa-map-marker" aria-hidden="true"></i>
        <span data-lang="en">{{ site.author.location }}</span>
        <span data-lang="zh" hidden>{{ site.author.location_zh }}</span>
      </li>
      <li><a href="mailto:{{ site.author.email }}"><i class="fas fa-fw fa-envelope" aria-hidden="true"></i> Email</a></li>
      <li><a href="https://github.com/{{ site.author.github }}" target="_blank" rel="noopener noreferrer"><i class="fab fa-fw fa-github" aria-hidden="true"></i> GitHub</a></li>
      <li><a href="{{ site.author.googlescholar }}" target="_blank" rel="noopener noreferrer"><i class="fas fa-fw fa-graduation-cap" aria-hidden="true"></i> Google Scholar</a></li>
      <li><a href="{{ site.author.semanticscholar }}" target="_blank" rel="noopener noreferrer"><i class="fas fa-fw fa-book-open" aria-hidden="true"></i> Semantic Scholar</a></li>
      <li><a href="{{ site.author.dblp }}" target="_blank" rel="noopener noreferrer"><i class="ai ai-dblp ai-fw" aria-hidden="true"></i> DBLP</a></li>
      <li><a href="{{ site.author.orcid }}" target="_blank" rel="noopener noreferrer"><i class="ai ai-orcid ai-fw" aria-hidden="true"></i> ORCID</a></li>
    </ul>
    <div class="author__urls_sm" aria-label="Academic profiles">
      <a href="mailto:{{ site.author.email }}" aria-label="Email"><i class="fas fa-fw fa-envelope" aria-hidden="true"></i></a>
      <a href="https://github.com/{{ site.author.github }}" aria-label="GitHub"><i class="fab fa-fw fa-github" aria-hidden="true"></i></a>
      <a href="{{ site.author.googlescholar }}" aria-label="Google Scholar"><i class="fas fa-fw fa-graduation-cap" aria-hidden="true"></i></a>
      <a href="{{ site.author.semanticscholar }}" aria-label="Semantic Scholar"><i class="fas fa-fw fa-book-open" aria-hidden="true"></i></a>
      <a href="{{ site.author.dblp }}" aria-label="DBLP"><i class="ai ai-dblp ai-fw" aria-hidden="true"></i></a>
      <a href="{{ site.author.orcid }}" aria-label="ORCID"><i class="ai ai-orcid ai-fw" aria-hidden="true"></i></a>
    </div>
  </div>
</div>
