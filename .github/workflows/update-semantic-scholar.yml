name: Update Semantic Scholar citations

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-citations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Fetch Semantic Scholar citation counts
        env:
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
        run: python bin/update_semantic_scholar_citations.py

      - name: Commit source cache
        id: commit-cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/json/semantic-scholar-citations.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update Semantic Scholar citation counts"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update deployed citation cache
        if: steps.commit-cache.outputs.changed == 'true'
        run: |
          git fetch origin gh-pages
          deploy_dir="$(mktemp -d)"
          git worktree add "$deploy_dir" origin/gh-pages
          mkdir -p "$deploy_dir/assets/json"
          cp assets/json/semantic-scholar-citations.json "$deploy_dir/assets/json/semantic-scholar-citations.json"
          cd "$deploy_dir"
          git add assets/json/semantic-scholar-citations.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Semantic Scholar citation counts"
            git push origin HEAD:gh-pages
          fi
