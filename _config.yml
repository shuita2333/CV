# Site settings
title: "Yuanhe Zhang | 张原赫"
description: "Academic homepage of Yuanhe Zhang: large language models, AI safety, and agent safety."
url: "https://shuita2333.github.io"
baseurl: "/CV"
repository: "shuita2333/CV"
timezone: Asia/Shanghai
lang: en

# Author profile
author:
  name: "Yuanhe Zhang"
  name_zh: "张原赫"
  avatar: "/CV/images/yuanhe-zhang.jpg"
  bio: "Ph.D. Student · BUPT"
  bio_zh: "博士研究生 · 北京邮电大学"
  location: "Beijing, China"
  location_zh: "中国，北京"
  email: "603747072@qq.com"
  github: "shuita2333"
  googlescholar: "https://scholar.google.com/citations?user=t1YN_XUAAAAJ&hl=en"
  semanticscholar: "https://www.semanticscholar.org/author/Yuanhe-Zhang/2336538746"
  dblp: "https://dblp.org/pid/381/4050.html"
  orcid: "https://orcid.org/0009-0004-6287-7374"

# Files and conversion
include:
  - _pages
exclude:
  - _bibliography
  - bin
  - node_modules
  - vendor
  - README.md
  - Gemfile
  - Gemfile.lock
  - run_server.sh
encoding: "utf-8"
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
highlighter: rouge

# Build
sass:
  sass_dir: _sass
  style: compressed
permalink: pretty
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
      author_profile: true

# AcadHomepage compatibility
google_scholar_stats_use_cdn: false
google_analytics_id:
google_site_verification:
bing_site_verification:
baidu_site_verification:
